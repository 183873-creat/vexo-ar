<style>
:root{--ink:#07090c;--ink2:#0e141b;--blue:#5689b4;--bl:#9bbddb;--paper:#f4f7fa;--tx:#e9eef3;--mu:#8d9aa7;--d:'Cormorant Garamond','Cairo',Georgia,serif;--b:'Cairo','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--b);background:var(--ink);color:var(--tx);line-height:1.8;overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--d);font-weight:500;line-height:1.15}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:28px}
:focus-visible{outline:2px solid var(--bl);outline-offset:3px}
/* nav */
nav{position:fixed;inset:0 0 auto;z-index:50;transition:background .5s,padding .5s;padding-block:22px}
nav.s{background:rgba(7,9,12,.82);backdrop-filter:blur(14px);padding-block:12px}
nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px}
nav img{height:30px;display:block}
.links{display:flex;gap:34px;font-size:15px;color:var(--tx)}
.links a{opacity:.75;transition:opacity .3s}.links a:hover{opacity:1}
.lang{display:flex;gap:4px;border:1px solid rgba(155,189,219,.35);border-radius:40px;padding:3px}
.lang button{background:none;border:0;color:var(--tx);font:600 12px var(--b);padding:5px 11px;border-radius:30px;cursor:pointer;letter-spacing:.08em;transition:.3s}
.lang button.on{background:var(--blue);color:#fff}
/* hero */
.hero{position:relative;height:100svh;min-height:620px;overflow:hidden;background:var(--ink)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.8s ease}
.slide.on{opacity:1}
.bg{position:absolute;inset:-10%;animation:kb 16s ease-in-out infinite alternate}
.slide:nth-child(1) .bg{background:repeating-linear-gradient(115deg,rgba(86,137,180,.08) 0 1px,transparent 1px 52px),radial-gradient(60% 80% at 72% 30%,#1e3d5a,transparent 70%),#07090c}
.slide:nth-child(2) .bg{background:repeating-linear-gradient(65deg,rgba(86,137,180,.08) 0 1px,transparent 1px 52px),radial-gradient(55% 75% at 22% 75%,#25507a,transparent 70%),#080b10;animation-direction:alternate-reverse}
.slide:nth-child(3) .bg{background:repeating-linear-gradient(115deg,rgba(86,137,180,.07) 0 1px,transparent 1px 52px),linear-gradient(140deg,#0a1017 20%,#1b3a57 100%)}
.mark{position:absolute;width:min(78vmin,720px);opacity:.16;animation:fl 20s ease-in-out infinite alternate;filter:drop-shadow(0 0 60px rgba(86,137,180,.35))}
.slide:nth-child(1) .mark{inset-inline-end:-6%;top:12%}
.slide:nth-child(2) .mark{inset-inline-start:-8%;top:20%;transform:scaleX(-1)}
.slide:nth-child(3) .mark{inset-inline-end:8%;top:-8%;width:min(60vmin,540px)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,9,12,.85),transparent 55%);pointer-events:none}
@keyframes kb{from{transform:scale(1) translate3d(-1.5%,0,0)}to{transform:scale(1.12) translate3d(1.5%,-2%,0)}}
@keyframes fl{from{translate:0 0;rotate:-2deg}to{translate:2% 4%;rotate:2deg}}
.cap{position:absolute;inset-inline:0;bottom:15vh;z-index:3}
.cap .t{max-width:900px}
.cap h1{font-size:clamp(40px,7vw,92px);margin-bottom:22px}
.cap p{max-width:520px;color:#c4cfd9;font-size:clamp(15px,1.6vw,18px)}
.bar{position:absolute;z-index:4;inset-inline:0;bottom:44px}
.bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px}
.dots{display:flex;gap:10px}
.dots button{width:56px;height:2px;border:0;background:rgba(255,255,255,.25);position:relative;cursor:pointer;overflow:hidden}
.dots button:after{content:"";position:absolute;inset:0;background:var(--bl);transform:scaleX(0);transform-origin:left}
.dots button.on:after{animation:pg 6.5s linear forwards}
[dir=rtl] .dots button:after{transform-origin:right}
@keyframes pg{to{transform:scaleX(1)}}
.btn{display:inline-block;border:1px solid var(--bl);color:#fff;padding:13px 34px;font-weight:600;font-size:15px;transition:.4s;background:transparent;cursor:pointer;font-family:var(--b)}
.btn:hover{background:var(--blue);border-color:var(--blue)}
.btn.f{background:var(--blue);border-color:var(--blue)}.btn.f:hover{background:#fff;color:var(--ink);border-color:#fff}
/* text reveal */
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-block:.14em;margin-block:-.14em}
.w>i{display:inline-block;font-style:normal;transform:translateY(112%);transition:transform 1.1s cubic-bezier(.2,.7,.1,1);transition-delay:calc(var(--i)*70ms + .2s)}
.on .w>i,.in .w>i{transform:none}
.fd{opacity:0;transform:translateY(18px);transition:opacity 1.2s ease .4s,transform 1.2s cubic-bezier(.2,.7,.1,1) .4s}
.fd.in,.on .fd{opacity:1;transform:none}
.slide .cap p{transition-delay:.9s}
/* sections */
section{padding-block:clamp(80px,12vw,150px)}
.light{background:var(--paper);color:#0c1218}
.light .mu{color:#55626f}
h2{font-size:clamp(34px,5vw,62px);margin-bottom:28px}
.about .g{display:grid;grid-template-columns:1.2fr 1fr;gap:70px;align-items:center}
.about p{color:var(--mu);margin-bottom:18px;max-width:560px}
.fig{position:relative;aspect-ratio:1;display:grid;place-items:center;border:1px solid rgba(86,137,180,.25);overflow:hidden;background:radial-gradient(circle at 50% 40%,#16324b,#0a0f15 70%)}
.fig img{width:72%;animation:fl 12s ease-in-out infinite alternate}
.rows{border-top:1px solid rgba(155,189,219,.2)}
.row{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;padding-block:34px;border-bottom:1px solid rgba(155,189,219,.2);transition:padding .5s,background .5s}
.row:hover{padding-inline:22px;background:rgba(86,137,180,.07)}
.row h3{font-size:clamp(26px,3vw,40px)}
.row p{color:var(--mu);max-width:520px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:50px}
.st{padding:0 26px;border-inline-start:1px solid rgba(12,18,24,.18)}
.st b{font:500 54px var(--d);color:var(--blue);display:block;line-height:1;margin-bottom:18px}
.st h3{font-size:26px;margin-bottom:10px}
.st p{font-size:15px;color:#55626f}
.ct{text-align:center;background:radial-gradient(70% 90% at 50% 100%,#17344f,var(--ink) 70%)}
.ct p{color:#b2bfcb;max-width:560px;margin:0 auto 38px}
.ct .acts{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.info{margin-top:44px;color:var(--mu);font-size:15px;direction:ltr}
footer{padding:30px 0;border-top:1px solid rgba(155,189,219,.15);font-size:13px;color:var(--mu)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px}
footer img{height:22px;opacity:.9}
:lang(ar) h1,:lang(ar) h2,:lang(ar) h3{line-height:1.4}
:lang(fr) .btn,:lang(en) .btn,:lang(fr) .links,:lang(en) .links{letter-spacing:.04em}
@media(max-width:860px){.links{display:none}.about .g,.row{grid-template-columns:1fr;gap:24px}.steps{grid-template-columns:1fr 1fr;row-gap:40px}.st{padding:0 18px}.bar .btn{display:none}.dots button{width:38px}}
@media(max-width:480px){.steps{grid-template-columns:1fr}nav img{height:24px}.wrap{padding-inline:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>

ar:{n1:"من نحن",n2:"خدماتنا",n3:"كيفاش نخدمو",n4:"تواصل معانا",cta:"ابدا مشروعك",
h1:"موقعك هو واجهة شركتك",s1:"VEXO شركة تخدم في صناعة المواقع الإلكترونية. نصاميو ونبرمجو مواقع فخمة تعرّف بيك وتجيب لك الزبائن.",
h2:"تصميم راقي، يخلي الزبون يثق فيك",s2:"كل تفصيلة في الموقع نخدموها بعناية، من الألوان للحركة، باش يبان الموقع تاعك في أحسن صورة.",
h3:"موقع سريع ويبان مليح في كل شاشة",s3:"تلفون، تابلت ولا كمبيوتر، موقعك يخدم بسلاسة ويعطي انطباع احترافي.",
a1:"شركة VEXO، نخدمولك موقع احترافي يناسب خدمتك",a2:"نحن فريق متخصص في تصميم وتطوير المواقع الإلكترونية. نخدمو مع المطاعم، الفنادق، المحلات والشركات اللي حابة تكون حاضرة في الأنترنت بصورة تليق بيها.",a3:"نحبو الخدمة النقية والتفاصيل الصغيرة. كل مشروع نبداوه بفهم شغلك مليح، ونكملوه بموقع تفتخر بيه.",
v0:"واش نقدمو لك",v1:"تصميم المواقع",d1:"مواقع تعريفية وصفحات هبوط بتصميم فخم، مبرمجة بأحدث التقنيات ومتوافقة مع كل الشاشات.",
v2:"المتاجر الإلكترونية",d2:"متجر كامل تبيع فيه بسهولة، مع الدفع عند الاستلام وتسيير الطلبيات والمنتجات.",
v3:"الهوية البصرية",d3:"لوغو، ألوان وخطوط تعطي لعلامتك شخصية واضحة وتخليها تتعرف عند الناس.",
v4:"السيو والتسويق",d4:"نحسنو ظهور موقعك في قوقل ونساعدوك توصل للزبائن المناسبين.",
p0:"كيفاش نخدمو",q1:"نسمعو ليك",e1:"نفهمو نشاطك وأهدافك والجمهور اللي تحب توصل ليه.",q2:"نصاميو",e2:"نقدمو لك تصميم يعكس هويتك ونعدلوه معاك حتى يعجبك.",q3:"نبرمجو",e3:"نحولو التصميم لموقع سريع وآمن وسهل التسيير.",q4:"نطلقو ونتبعو",e4:"نطلقو الموقع ونبقاو معاك للدعم والتطوير.",
c1:"خلينا نبداو مشروعك",c2:"احكي لنا على فكرتك ونرجعو لك في أقرب وقت بعرض واضح.",wa:"واتساب",ml:"إيميل",ft:"© 2026 VEXO. كل الحقوق محفوظة."},
fr:{n1:"À propos",n2:"Services",n3:"Méthode",n4:"Contact",cta:"Lancer mon projet",
h1:"Votre site, la vitrine de votre entreprise",s1:"VEXO conçoit et développe des sites web haut de gamme qui font connaître votre activité et attirent des clients.",

a1:"VEXO, un site professionnel adapté à votre activité",a2:"Nous sommes une équipe spécialisée dans la conception et le développement de sites web. Nous accompagnons restaurants, hôtels, commerces et entreprises qui veulent une présence en ligne à leur hauteur.",a3:"Nous aimons le travail soigné et les petits détails. Chaque projet commence par la compréhension de votre métier et se termine par un site dont vous serez fier.",
v0:"Ce que nous faisons",v1:"Création de sites web",d1:"Sites vitrines et pages d’atterrissage au design raffiné, développés avec des technologies récentes et adaptés à tous les écrans.",
v2:"Boutiques en ligne",d2:"Une boutique complète pour vendre simplement, avec paiement à la livraison et gestion des commandes et produits.",
v3:"Identité visuelle",d3:"Logo, couleurs et typographie qui donnent à votre marque une personnalité claire et reconnaissable.",
v4:"SEO et marketing",d4:"Nous améliorons votre visibilité sur Google et vous aidons à toucher les bons clients.",
p0:"Notre méthode",q1:"Écoute",e1:"Nous comprenons votre activité, vos objectifs et votre public.",q2:"Design",e2:"Nous proposons un design fidèle à votre identité, ajusté avec vous jusqu’à validation.",q3:"Développement",e3:"Nous transformons le design en un site rapide, sûr et facile à gérer.",q4:"Lancement et suivi",e4:"Nous mettons en ligne et restons à vos côtés pour le support et l’évolution.",
c1:"Démarrons votre projet",c2:"Parlez-nous de votre idée, nous revenons vers vous rapidement avec une proposition claire.",wa:"WhatsApp",ml:"E-mail",ft:"© 2026 VEXO. Tous droits réservés."},

h1:"Your website is your company’s front door",s1:"VEXO designs and builds refined websites that introduce your business and bring in clients.",
h2:"Elegant design that earns trust",s2:"Every detail is crafted with care, from colour to motion, to present your brand at its best.",
h3:"Fast and flawless on every screen",s3:"Phone, tablet or desktop, your site stays smooth and leaves a professional impression.",
a1:"VEXO builds a professional website that fits your business",a2:"We are a team specialised in web design and development. We work with restaurants, hotels, shops and companies that want an online presence worthy of them.",a3:"We love clean work and small details. Every project starts with understanding your business and ends with a site you are proud of.",

const $=(s,r=document)=>[...r.querySelectorAll(s)];
function setLang(l){
 const h=document.documentElement;h.lang=l;h.dir=l==='ar'?'rtl':'ltr';
 $('[data-k]').forEach(e=>{const t=T[l][e.dataset.k];
  if(e.hasAttribute('data-split')){e.textContent='';t.split(' ').forEach((w,i)=>{const s=document.createElement('span');s.className='w';s.style.setProperty('--i',i);const n=document.createElement('i');n.textContent=w;s.append(n,' ');e.append(s)})}
  else e.textContent=t});
 $('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
 try{localStorage.setItem('vexo-lang',l)}catch(e){}
}
$('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
let l0='ar';try{l0=localStorage.getItem('vexo-lang')||'ar'}catch(e){}
setLang(T[l0]?l0:'ar');
/* slideshow */
const sl=$('.slide'),dt=$('.dots button');let c=0,tm;
function go(n){sl[c].classList.remove('on');dt[c].classList.remove('on');c=n%sl.length;void dt[c].offsetWidth;sl[c].classList.add('on');dt[c].classList.add('on');clearInterval(tm);tm=setInterval(()=>go(c+1),6500)}
dt.forEach((d,i)=>d.onclick=()=>go(i));tm=setInterval(()=>go(c+1),6500);
/* reveal on scroll + nav */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.2});
$('section [data-split],section .fd,.steps .fd').forEach(e=>io.observe(e));
const nv=document.getElementById('nv');const sc=()=>nv.classList.toggle('s',scrollY>40);addEventListener('scroll',sc,{passive:true});sc();
</script>
